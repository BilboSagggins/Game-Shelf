<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Board game recommender with BoardGameGeek collection import, search, and rulebook and how-to-play links.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tabletop Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky shelf-style nav, a "your table" profile strip, then a grid of game boxes; game details open in a side sheet. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#E2E6EB; --ink:#18212B; --muted:#5A6672; --line:#D3D9E0;
  --accent:#D44E28; --accent-ink:#FFFFFF; --felt:#1E6455; --felt-soft:#DCEDE8; --warn:#9A6400;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,40,.08), 0 6px 18px rgba(20,30,40,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --sunk:#0D1217; --ink:#E6EBF0; --muted:#95A2AF; --line:#2A3440;
  --accent:#F0703F; --accent-ink:#1A0E08; --felt:#5CBFA6; --felt-soft:#173A33; --warn:#E3B04B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --sunk:#0D1217; --ink:#E6EBF0; --muted:#95A2AF; --line:#2A3440;
  --accent:#F0703F; --accent-ink:#1A0E08; --felt:#5CBFA6; --felt-soft:#173A33; --warn:#E3B04B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:4px;border-radius:10px}
nav.tabs a{padding:7px 14px;border-radius:7px;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted)}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.tabs .count{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--felt)}

main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.1}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--felt-soft);border:1px dashed var(--felt);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.banner strong{color:var(--felt)}
.banner .sp{flex:1;min-width:0}

/* profile strip */
.profile{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:20px}
.dna{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dna span{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.dna span b{font-family:var(--f-mono);font-weight:500;color:var(--felt);margin-left:4px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px}
.stats dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:2px 0 0;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 0;border-block:1px solid var(--line);margin-bottom:20px}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.filters select,.filters input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
.filters input[type=search]{min-width:0;flex:1 1 240px;font-size:15px;padding:9px 12px}
.filters .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.owned{background:var(--felt);color:var(--surface);border-color:var(--felt)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}

/* game grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;width:100%;box-shadow:var(--shadow);background:var(--c1)}
.box::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--ang),transparent 0 14px,rgba(255,255,255,.07) 14px 28px)}
.box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(0,0,0,.22)}
.box .initial{position:absolute;right:-6px;top:-22px;font-family:var(--f-display);font-weight:800;font-size:120px;line-height:1;color:rgba(255,255,255,.14)}
.box .t{position:absolute;left:12px;right:12px;bottom:20px;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;color:#fff;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.box .yr{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-size:11px;color:rgba(255,255,255,.8)}
.box .tag{position:absolute;right:10px;top:10px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.92);color:#18212B}
.box:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.box{transition:transform .15s}}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:2px;align-items:center}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink)}
.pips i.half{background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%)}
.why{font-size:13px;color:var(--muted);margin:0}
.why b{color:var(--ink);font-weight:600}
.match{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--felt)}
.match .bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.match .bar span{display:block;height:100%;background:var(--felt)}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

section+section{margin-top:40px}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* AI picks */
.ai{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.ai .grid{margin-top:16px}
.ai-card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.ai-card h3 button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.status{font-size:13px;color:var(--muted)}

/* shelf page */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.panel ol li+li{margin-top:4px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input,.panel textarea{flex:1 1 180px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.panel textarea{width:100%;min-height:90px;resize:vertical;font:inherit}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;font-size:14px;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.swatch{width:34px;height:26px;border-radius:4px;flex:none;background:var(--c1)}
.li .nm{flex:1;min-width:0}
.li .nm button{all:unset;cursor:pointer;font-weight:600}
.li .nm small{display:block;color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted)}
.warn{color:var(--warn)}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;word-break:break-all}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .hero{position:relative;height:200px;background:var(--c1);overflow:hidden}
.sheet .hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--ang),transparent 0 18px,rgba(255,255,255,.07) 18px 36px)}
.sheet .hero .initial{position:absolute;right:-10px;top:-40px;font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;color:rgba(255,255,255,.13)}
.sheet .hero h2{position:absolute;left:24px;right:24px;bottom:20px;color:#fff;font-size:32px;line-height:1.05}
.sheet .hero .yr{position:absolute;left:24px;top:18px;font-family:var(--f-mono);font-size:12px;color:rgba(255,255,255,.85)}
.sheet .close{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.92);color:#18212B;border:0;border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer}
.sheet .body{padding:22px 24px 40px;display:flex;flex-direction:column;gap:22px}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.specs div{background:var(--surface);padding:10px 12px}
.specs dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.specs dd{margin:3px 0 0;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.tags span.m{background:var(--sunk);border-color:transparent}
.learn{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.learn a{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
.learn a:last-child{border-bottom:0}
.learn a:hover{background:var(--sunk)}
.learn .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--accent)}
.learn .tx{flex:1;min-width:0}
.learn .tx b{display:block;font-weight:600}
.learn .tx small{color:var(--muted);font-size:12.5px}
.learn .arr{color:var(--muted)}
.similar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.similar .box{aspect-ratio:4/3}
.similar .box .t{font-size:14px;bottom:16px;left:9px;right:9px}
.similar .box .initial{font-size:70px;top:-10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:760px){
  .profile,.two{grid-template-columns:minmax(0,1fr)}
  nav.tabs{margin-left:0;width:100%}
  nav.tabs a{flex:1;text-align:center;padding:7px 6px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .box .t{font-size:16px}
  .sheet .hero h2{font-size:26px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#discover" aria-label="Tabletop Shelf home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path fill="var(--accent)" d="M14 2.5c2.6 0 4.4 2 4.4 4.4 0 1.1-.4 2-1 2.8 3.6.6 8.1 2 8.1 4.6 0 1.5-1.7 2.2-4.2 2.3l3.4 6.8c.4.8-.2 1.6-1 1.6h-5.3L14 19l-4.4 6H4.3c-.8 0-1.4-.8-1-1.6l3.4-6.8c-2.5-.1-4.2-.8-4.2-2.3 0-2.6 4.5-4 8.1-4.6-.6-.8-1-1.7-1-2.8 0-2.4 1.8-4.4 4.4-4.4z"/></svg>
      Tabletop Shelf
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#discover" data-view="discover">For you</a>
      <a href="#browse" data-view="browse">Search</a>
      <a href="#shelf" data-view="shelf">My shelf<span class="count" id="shelfCount"></span></a>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------- Catalog ----------
   [name, year, weight(1-5, approx BGG), minP, maxP, minutes, mechanics, themes, blurb] */
const RAW = [
["Catan",1995,2.3,3,4,90,"Trading|Dice|Network Building|Negotiation","Medieval|Economic","Gather resources, trade with the table, and build roads and settlements across a hex island."],
["Ticket to Ride",2004,1.8,2,5,60,"Set Collection|Route Building|Hand Management","Trains|Travel","Collect colored train cards and claim railway routes across North America."],
["Ticket to Ride: Europe",2005,1.9,2,5,60,"Set Collection|Route Building|Hand Management","Trains|Travel","Ticket to Ride with tunnels, ferries and train stations across Europe."],
["Carcassonne",2000,1.9,2,5,45,"Tile Placement|Area Control","Medieval|City","Draw and place tiles to grow a landscape, then claim cities, roads and fields with meeples."],
["Pandemic",2008,2.4,2,4,45,"Cooperative|Hand Management|Action Points|Set Collection","Science","A team of specialists races to cure four diseases before outbreaks overwhelm the world."],
["Pandemic Legacy: Season 1",2015,2.8,2,4,60,"Cooperative|Legacy|Campaign|Hand Management|Action Points","Science","Pandemic as a year-long campaign where your choices permanently change the game."],
["Wingspan",2019,2.5,1,5,70,"Engine Building|Hand Management|Dice|Set Collection|Solo","Animals|Nature","Attract birds to your wildlife preserves; each one adds to a growing engine of powers."],
["Azul",2017,1.8,2,4,40,"Drafting|Pattern Building|Set Collection","Abstract","Draft colorful tiles and decorate a palace wall without wasting any."],
["7 Wonders",2010,2.3,2,7,30,"Drafting|Set Collection|Hand Management","Ancient|Civilization","Draft cards over three ages to build an ancient city and its wonder. Plays 7 in 30 minutes."],
["7 Wonders Duel",2015,2.2,2,2,30,"Drafting|Set Collection","Ancient|Civilization","A tight two-player take on 7 Wonders with a military tug-of-war and science race."],
["Splendor",2014,1.8,2,4,30,"Engine Building|Set Collection","Economic|Historical","Collect gems, buy cards that give permanent discounts, and attract visiting nobles."],
["Codenames",2015,1.3,2,8,15,"Party|Deduction","Mystery","Spymasters give one-word clues so their team can find secret agents on the grid."],
["Codenames: Duet",2017,1.3,2,2,15,"Cooperative|Deduction|Party","Mystery","The cooperative two-player version of Codenames."],
["Dominion",2008,2.4,2,4,30,"Deck Building|Hand Management","Medieval","The original deck-builder: buy cards to grow your deck and your kingdom."],
["Terraforming Mars",2016,3.3,1,5,120,"Engine Building|Hand Management|Tile Placement|Solo","Sci-Fi|Space|Science","Corporations race to make Mars habitable with cards, tiles and production tracks."],
["Gloomhaven",2017,3.9,1,4,120,"Cooperative|Campaign|Hand Management|Dungeon Crawl|Legacy|Solo","Fantasy|Adventure","A huge tactical campaign of card-driven combat across a branching fantasy story."],
["Gloomhaven: Jaws of the Lion",2020,3.6,1,4,120,"Cooperative|Campaign|Hand Management|Dungeon Crawl|Solo","Fantasy|Adventure","A smaller Gloomhaven with a guided tutorial campaign; the friendliest way in."],
["Frosthaven",2023,4.4,1,4,180,"Cooperative|Campaign|Legacy|Hand Management|Dungeon Crawl|Solo","Fantasy|Adventure","The massive Gloomhaven sequel with an outpost to build between scenarios."],
["Spirit Island",2017,4.0,1,4,120,"Cooperative|Area Control|Hand Management|Asymmetric|Solo","Fantasy|Mythology","Island spirits with very different powers work together to drive off colonizing invaders."],
["Scythe",2016,3.4,1,5,115,"Area Control|Engine Building|Asymmetric|Economic|Solo","Historical|Sci-Fi","Lead a faction in an alternate 1920s Europe of mechs, farms and territory."],
["Everdell",2018,2.8,1,4,80,"Worker Placement|Engine Building|Hand Management|Solo","Animals|Nature|Fantasy","Woodland critters build a city of cards over four seasons."],
["Agricola",2007,3.6,1,4,120,"Worker Placement|Economic|Solo","Farming|Historical","Grow a 17th-century farm and keep your family fed through the harvests."],
["Puerto Rico",2002,3.3,3,5,120,"Role Selection|Economic|Engine Building","Historical|Economic","Choose roles to plant, build, produce and ship goods."],
["Power Grid",2004,3.3,2,6,120,"Auction|Network Building|Economic","Economic|City","Bid on power plants, buy fuel and wire up cities across the map."],
["Brass: Birmingham",2018,3.9,2,4,120,"Network Building|Hand Management|Economic|Route Building","Historical|Economic|Trains","Build industries, canals and rails during the Industrial Revolution."],
["Brass: Lancashire",2007,3.9,2,4,120,"Network Building|Hand Management|Economic|Route Building","Historical|Economic|Trains","The original Brass, centered on Lancashire's cotton mills and ports."],
["Ark Nova",2021,3.7,1,4,150,"Engine Building|Hand Management|Tile Placement|Solo","Animals|Nature","Design a modern zoo and fund conservation projects."],
["Dune: Imperium",2020,3.0,1,4,120,"Worker Placement|Deck Building|Solo","Sci-Fi","Deck-building plus worker placement in a fight for control of Arrakis."],
["Root",2018,3.7,2,4,90,"Area Control|Asymmetric|Hand Management","Animals|Fantasy","Woodland factions with completely different rules fight for the forest."],
["Cascadia",2021,1.9,1,4,45,"Tile Placement|Drafting|Pattern Building|Solo","Animals|Nature","Draft habitat tiles and wildlife tokens to build the Pacific Northwest."],
["Harmonies",2024,2.0,1,4,40,"Tile Placement|Pattern Building|Puzzle|Solo","Animals|Nature","Stack colored tokens into landscapes that give animals a home."],
["Patchwork",2014,1.6,2,2,30,"Polyomino|Puzzle|Economic","Abstract","Two players race to fill a quilt with patch tiles and buttons."],
["Sagrada",2017,1.9,1,4,40,"Dice|Drafting|Pattern Building|Puzzle|Solo","Abstract","Draft dice to build a stained-glass window under color and number rules."],
["Kingdomino",2016,1.2,2,4,15,"Tile Placement|Drafting","Medieval","Pick domino tiles and build a 5×5 kingdom of matching terrain."],
["Love Letter",2012,1.2,2,6,20,"Deduction|Hand Management|Bluffing","Medieval","Sixteen cards of bluffing and deduction."],
["The Crew: The Quest for Planet Nine",2019,2.0,2,5,20,"Trick Taking|Cooperative|Campaign","Space","A cooperative trick-taking campaign with tightly limited communication."],

const ALL_THEME=[...new Set(CAT.flatMap(g=>g.c))].sort();
let LK={q:"",state:"idle",items:[],err:""};
async function lookup(q){
  q=(q||"").trim(); if(q.length<2){toast("Type at least two letters to search.");return;}
  LK={q,state:"loading",items:[],err:""}; render();
  try{
    const sample=window.claude?.use?await claude.use("sample"):null;
    if(!sample){LK.state="off";render();return;}
    const res=await sample.json(`You are a BoardGameGeek expert. The user is searching BoardGameGeek for: "${q}".
List up to 8 published board games or card games from BoardGameGeek that match this search, best title matches first, then games whose name contains the words. If the search reads like a description (a mechanic, theme or "games like X"), list the best-known matching games instead. Only real, published games; never invent one. Skip expansions unless the search names one.
For each game give:
- "name": its primary title on BoardGameGeek
- "year": year published
- "minPlayers", "maxPlayers": official player count
- "minutes": typical play time
- "weight": BoardGameGeek complexity 1.0-5.0, one decimal
- "mechanics": 1-5 picked only from: ${ALL_MECH.join(", ")}
- "themes": 1-3 picked only from: ${ALL_THEME.join(", ")}
- "blurb": one plain sentence on what you do in the game
Return only JSON: {"games":[...]}`,{modelTier:"default",cache:true});
    const arr=res&&Array.isArray(res.games)?res.games:Array.isArray(res)?res:[];
    const num=(v,d,lo,hi)=>{v=Number(v);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
    LK.items=arr.filter(x=>x&&x.name).slice(0,8).map(x=>{
      const name=String(x.name).trim();
      const inCat=BY_NORM[norm(name)]; if(inCat) return inCat;
      const id="x-"+slug(name);
      if(BY_ID[id]) return BY_ID[id];
      const mn=Math.round(num(x.minPlayers,1,1,20)), mx=Math.round(num(x.maxPlayers,mn,mn,100));
      const g={id,custom:true,n:name,y:Math.round(num(x.year,0,0,2100))||"",w:Math.round(num(x.weight,2,1,5)*10)/10,p:[mn,mx],t:Math.round(num(x.minutes,45,5,600)),
        m:(Array.isArray(x.mechanics)?x.mechanics:[]).map(String).filter(m=>ALL_MECH.includes(m)).slice(0,5),
        c:(Array.isArray(x.themes)?x.themes:[]).map(String).filter(c=>ALL_THEME.includes(c)).slice(0,3),
        d:String(x.blurb||"").slice(0,300)};
      if(!g.m.length) g.m=["Hand Management"];
      BY_ID[id]=g; return g;
    });
    LK.state=LK.items.length?"done":"empty";
  }catch(e){
    LK.state=e&&e.code==="not_granted"?"off":"error";
    LK.err=e&&e.code==="rate_limited"?"Too many searches just now. Wait a minute and try again.":"The search didn't go through. Try again.";
  }
  render();
}

/* ---------- Recommender ---------- */
const jac=(a,b)=>{const A=new Set(a);let i=0;b.forEach(x=>A.has(x)&&i++);const u=new Set([...a,...b]).size;return u?i/u:0};
function sim(a,b){
  const pOver = Math.max(0,Math.min(a.p[1],b.p[1])-Math.max(a.p[0],b.p[0])+1)>0?1:0;
  const tr = Math.min(a.t,b.t)/Math.max(a.t,b.t);
  return .52*jac(a.m,b.m) + .22*jac(a.c,b.c) + .16*(1-Math.abs(a.w-b.w)/4) + .04*pOver + .06*tr;
}
function profile(){
  const g=S.owned.map(id=>BY_ID[id]).filter(Boolean);
  if(!g.length) return null;
  const cnt=(k)=>{const m={};g.forEach(x=>x[k].forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  return {games:g, mech:cnt("m"), theme:cnt("c"), w:avg(g.map(x=>x.w)), t:Math.round(avg(g.map(x=>x.t))),
          pmin:Math.round(avg(g.map(x=>x.p[0]))), pmax:Math.round(avg(g.map(x=>Math.min(x.p[1],8))))};
}
function recommend(){
  const P=profile(); if(!P) return [];
  const mechW=Object.fromEntries(P.mech.map(([k,v])=>[k,v/P.games.length]));
  return CAT.filter(g=>!owns(g.id)&&passes(g)).map(g=>{
    const sims=P.games.map(o=>({o,s:sim(g,o)})).sort((a,b)=>b.s-a.s);
    const top=sims.slice(0,3); const base=top.reduce((s,x)=>s+x.s,0)/top.length;
    const taste=g.m.reduce((s,m)=>s+(mechW[m]||0),0)/Math.max(2,g.m.length);
    const score=.75*base+.25*Math.min(1,taste);
    const shared=[...new Set(top.slice(0,2).flatMap(x=>x.o.m.filter(m=>g.m.includes(m))))].slice(0,2);
    return {g,score,because:top.slice(0,2).map(x=>x.o),shared};
  }).sort((a,b)=>b.score-a.score);
}
function passes(g){
  if(F.players!=="any"){const n=+F.players; if(n===6? g.p[1]<6 : (g.p[0]>n||g.p[1]<n)) return false;}
  if(F.time!=="any" && g.t>+F.time) return false;
  if(F.weight==="light"&&g.w>2.2) return false;
  if(F.weight==="medium"&&(g.w<=2.2||g.w>3.4)) return false;
  if(F.weight==="heavy"&&g.w<=3.4) return false;
  if(F.mech.size && ![...F.mech].every(m=>g.m.includes(m))) return false;
  if(F.q){const q=norm(F.q); const hay=norm([g.n,g.d,...g.m,...g.c].join(" ")); if(!q.split(" ").every(w=>hay.includes(w))) return false;}
  return true;
}

/* ---------- Helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function boxStyle(name){const h=hash(name);const hue=h%360;const sat=34+(h>>9)%22;const lit=34+(h>>14)%12;const ang=[45,-45,90,0,135][(h>>4)%5];
  return `--c1:hsl(${hue} ${sat}% ${lit}%);--ang:${ang}deg`;}
const initial=n=>esc(n.replace(/^(the|a)\s+/i,"").replace(/^[^A-Za-z0-9]+/,"").charAt(0).toUpperCase());
function pips(w){let s='<span class="pips" title="Weight '+w.toFixed(1)+' of 5">';for(let i=1;i<=5;i++){s+='<i class="'+(w>=i-.25?"on":w>=i-.75?"half":"")+'"></i>';}return s+"</span>";}
const players=g=>g.p[0]===g.p[1]?g.p[0]+"p":g.p[0]+"–"+(g.p[1]>=20?g.p[1]+"+":g.p[1])+"p";
function box(g,tag){return `<button class="box" style="${boxStyle(g.n)}" data-open="${g.id}" aria-label="Open ${esc(g.n)}">
  <span class="initial" aria-hidden="true">${initial(g.n)}</span><span class="yr">${g.y}</span>${tag?`<span class="tag">${tag}</span>`:""}
  <span class="t">${esc(g.n)}</span></button>`;}
function metaRow(g){return `<div class="meta">${pips(g.w)}<span>${g.w.toFixed(1)}</span><span>${players(g)}</span><span>${g.t}′</span></div>`;}
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",3200);}

  const names=[...S.owned.map(id=>BY_ID[id]?.n).filter(Boolean),...S.extra];
  let body="";
  if(ai.state==="loading") body=`<p class="status" role="status">Thinking about your shelf…</p>`;
  else if(ai.state==="error") body=`<p class="status warn">${esc(ai.err)}</p>`;
  else if(ai.state==="off") body=`<p class="status">Claude picks aren't available in this view. The catalog recommendations above still work.</p>`;
  if(ai.items.length) body+=`<div class="grid">${ai.items.map((x,i)=>`<div class="ai-card"><span class="eyebrow">${esc(x.year||"")} · ${esc(x.players||"")} · ${esc(x.time||"")}</span><h3><button data-ai="${i}">${esc(x.name)}</button></h3><p class="why">${esc(x.why)}</p><div class="row"><button class="btn sm" data-ai="${i}">Rules & videos</button></div></div>`).join("")}</div>`;
  return `<div class="ai"><div class="sechead"><div><span class="eyebrow">Beyond the catalog</span><h2>Ask Claude for picks</h2>
    <p class="lede">The list above draws from ${CAT.length} well-known games. Claude can look across the whole hobby, using all ${names.length} games on your shelf and your filters.</p></div>
    <button class="btn primary" data-act="ai" ${!names.length||ai.state==="loading"?"disabled":""}>${ai.items.length?"Get different picks":"Get 6 picks"}</button></div>${body}</div>`;
}
async function askClaude(){
  const names=[...S.owned.map(id=>BY_ID[id]?.n).filter(Boolean),...S.extra];
  ai={state:"loading",items:ai.items,err:""}; render();
  try{
    const sample=await claude.use("sample");
    if(!sample){ai.state="off";render();return;}
    const prev=ai.items.map(x=>x.name);
    const f=[F.players!=="any"?`plays well at ${F.players==="6"?"6+":F.players} player(s)`:"",F.time!=="any"?`plays in ${F.time} minutes or less`:"",F.weight!=="any"?`is ${F.weight} weight`:""].filter(Boolean).join(", ");
    const prompt=`You are a board game expert recommending games.
The player owns: ${names.join("; ")}.
${S.wish.length?"Already on their wishlist (do not repeat): "+S.wish.map(id=>BY_ID[id]?.n).join("; ")+".":""}
${prev.length?"Do not repeat these earlier picks: "+prev.join("; ")+".":""}
${f?"Each pick must be a game that "+f+".":""}
Recommend 6 published board games they do not own. Prefer a mix: a couple of well-known hits that fit their taste and a few less obvious gems. Use the game's exact name as listed on BoardGameGeek.
Return only JSON: an array of 6 objects with keys "name", "year" (number), "players" (like "2–4p"), "time" (like "60 min"), "why" (one sentence tying it to specific games they own).`;
    const res=await sample.json(prompt,{modelTier:"default",cache:false});
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.picks)?res.picks:[]);
    ai={state:"idle",items:arr.filter(x=>x&&x.name).slice(0,6).map(x=>({name:String(x.name),year:x.year?String(x.year):"",players:String(x.players||""),time:String(x.time||""),why:String(x.why||"")})),err:""};
    if(!ai.items.length){ai.state="error";ai.err="Claude didn't return any picks. Try again.";}
  }catch(e){
    ai.state=e&&e.code==="not_granted"?"off":"error";
    ai.err=e&&e.code==="rate_limited"?"Too many requests just now. Wait a minute and try again.":"Couldn't get picks right now. Try again in a moment.";
  }
  render();
}

let confirmClear=false, pasteBusy=false;
async function handlePaste(text){
  text=(text||"").trim(); if(!text){toast("Paste your collection or some game names first.");return;}
  const first=text.split(/\r?\n/)[0].toLowerCase();
  if(first.includes("objectname")){importCSV(text);return;}
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const looksLikeList=lines.length<=300&&lines.every(l=>l.length<70&&!/\t/.test(l)&&!/^\d+(\.\d+)?$/.test(l));
  let names=null;
  if(!looksLikeList){
    pasteBusy=true; render();
    try{
      const sample=window.claude?.use?await claude.use("sample"):null;
      if(sample){
        const res=await sample.json(`Below is text copied from a BoardGameGeek collection page (or similar). Extract the titles of the board games the person OWNS. Ignore navigation, column headers, ratings, play counts, prices, comments, years and expansion markers. If the page shows status like "Owned", "Prev. Owned", "Want" or "Wishlist", include only games marked Owned; if no status is shown, include every game. Use each game's title exactly as written, without the year. Return only JSON: {"games": ["title", ...]}.\n\nTEXT:\n${text.slice(0,60000)}`,{modelTier:"default",cache:false});
        if(res&&Array.isArray(res.games)) names=res.games.map(String);
      }
    }catch(e){}
    pasteBusy=false;
  }
  if(!names) names=lines.map(l=>l.split("\t")[0].replace(/\s*\(\d{4}\)\s*$/,"").trim()).filter(l=>l&&!/^\d+(\.\d+)?$/.test(l));
  if(!names.length){render();toast("Couldn't find any game titles in that text.");return;}
  const r=addNames(names,false);
  const box=document.getElementById("paste"); if(box) box.value="";
  toast(`Added ${r.hit+r.miss} games · ${r.hit} matched the catalog${r.miss?`, ${r.miss} kept for Claude's picks`:""}.`);
}

/* ---------- Import ---------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";} else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function addNames(names,replace){
  if(S.example||replace){S.example=false;S.owned=[];S.extra=[];}
  let hit=0,miss=0;
  names.map(n=>n.trim()).filter(Boolean).forEach(n=>{
    const g=BY_NORM[norm(n)];
    if(g){if(!owns(g.id)){S.owned.push(g.id);hit++;} S.wish=S.wish.filter(x=>x!==g.id);}
    else if(!S.extra.some(e=>norm(e)===norm(n))){S.extra.push(n);miss++;}
  });
  save(); render();
  return {hit,miss};
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2){toast("That file doesn't look like a BGG collection export.");return;}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  let ni=head.indexOf("objectname"); if(ni<0) ni=head.findIndex(h=>h==="name"||h==="game"||h==="title");
  if(ni<0){toast("Couldn't find a game name column. Use the CSV from BGG's Export.");return;}
  const oi=head.indexOf("own");
  const names=rows.slice(1).filter(r=>oi<0||r[oi]==="1").map(r=>r[ni]||"");
  const {hit,miss}=addNames(names,true);
  toast(`Imported ${hit+miss} owned games · ${hit} matched the catalog${miss?`, ${miss} kept for Claude's picks`:""}.`);
  location.hash="discover";
}

/* ---------- Render & events ---------- */
function render(){
  const main=document.getElementById("main");
  const focusId=document.activeElement&&document.activeElement.id; const caret=document.activeElement&&document.activeElement.selectionStart;
  main.innerHTML= view==="browse"?vBrowse(): view==="shelf"?vShelf(): vDiscover();
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.view===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  const n=S.owned.length+S.extra.length; document.getElementById("shelfCount").textContent=n?n:"";
  document.getElementById("sheetRoot").innerHTML=sheetHTML();
  document.body.style.overflow=(openId||openExtra)?"hidden":"";
  if(focusId){const el=document.getElementById(focusId); if(el){el.focus(); if(caret!=null&&el.setSelectionRange) try{el.setSelectionRange(caret,caret);}catch(e){}}}
  const drop=document.getElementById("drop");
  if(drop){
    ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
    ["dragleave","drop"].forEach(e=>drop.addEventListener(e,()=>drop.classList.remove("over")));
    drop.addEventListener("drop",ev=>{ev.preventDefault();const f=ev.dataTransfer.files[0];if(f)f.text().then(importCSV);});
    document.getElementById("csv").addEventListener("change",ev=>{const f=ev.target.files[0];if(f)f.text().then(importCSV);});
  }
}
function closeSheet(){
  if(openId){history.replaceState(null,"","#"+view);}
  openId=null;openExtra=null;render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-own],[data-wish],[data-act],[data-mech],[data-ai],[data-extra-open],[data-addextra],[data-rmx]");
  if(!t) return;
  const d=t.dataset;
  if(d.open){e.preventDefault();openExtra=null;location.hash="game-"+d.open;return;}
  if(d.own){toggleOwn(d.own);return;}
  if(d.wish){toggleWish(d.wish);return;}
  if(d.mech){F.mech.has(d.mech)?F.mech.delete(d.mech):F.mech.add(d.mech);render();return;}
  if(d.ai!=null&&d.ai!==""){openId=null;openExtra=ai.items[+d.ai];render();return;}
  if(d.extraOpen){e.preventDefault();openId=null;openExtra={name:d.extraOpen};render();return;}
  if(d.addextra){const r=addNames([d.addextra],false);toast(r.hit?"Added to your shelf.":"Added to your shelf. It's not in the catalog, so Claude's picks will use it.");return;}
  if(d.rmx){S.extra.splice(+d.rmx,1);save();render();return;}
  switch(d.act){
    case "close": closeSheet(); break;
    case "clearf": F.players=F.time=F.weight="any";F.q="";F.mech.clear();render();break;
    case "lookup": lookup(F.q); break;
    case "ai": askClaude(); break;
    case "savebgg": {S.bgg=document.getElementById("bggUser").value.trim();save();render();toast(S.bgg?"Linked "+S.bgg+".":"Unlinked.");break;}
    case "paste": handlePaste(document.getElementById("paste").value); break;
    case "clearshelf": if(S.example){S.example=false;S.owned=[];S.extra=[];save();render();} else {confirmClear=true;render();} break;
    case "clearyes": S.owned=[];S.extra=[];confirmClear=false;save();render();break;
    case "clearno": confirmClear=false;render();break;
  }
});
document.addEventListener("change",e=>{const f=e.target.dataset.f;if(f){F[f]=e.target.value;render();}});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){F.q=e.target.value;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="f-q"){e.preventDefault();lookup(F.q);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(openId||openExtra))closeSheet(); if(e.key==="Enter"&&e.target.id==="bggUser"){document.querySelector('[data-act="savebgg"]').click();}});
route();
</script>
